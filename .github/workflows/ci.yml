name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx tsx --test test/chain-store.test.ts

  e2e:
    name: E2E - pair audit loop (opencode free model)
    runs-on: ubuntu-latest
    needs: unit
    env:
      PI_OFFLINE: "1"
      PI_DECISION_AUDITOR_INJECT: "off"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        # v4.4.0
        with:
          node-version: 22
      - name: Install pi
        # adhoc npm global install required - pi CLI is the test target itself
        run: npm install -g @earendil-works/pi-coding-agent
      - name: Add npm global bin to PATH
        run: echo "$(npm config get prefix)/bin" >> $GITHUB_PATH
      - name: Install pi-subagents (auditor dependency)
        run: pi install npm:pi-subagents
      - name: Install opencode-pi (free no-key model bridge)
        run: pi install npm:opencode-pi
      - name: Install opencode CLI (required by opencode-pi bridge)
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - name: Verify opencode CLI
        run: opencode --version
      - name: Install plugin (local path)
        run: pi install "$GITHUB_WORKSPACE"
      - name: Register auditor agent (local-path workaround)
        run: |
          mkdir -p ~/.pi/agent/agents
          cp "$GITHUB_WORKSPACE/agents/decision-auditor.md" ~/.pi/agent/agents/
      - name: Run E2E - decision_add auto-triggers audit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e" && cd "$GITHUB_WORKSPACE/e2e"
          # 空 package.json 作为仓库根标记：让 resolveProjectRoot 稳定指向 e2e（而非向上找到 pi-pair）
          echo '{}' > package.json
          cat > prompt.txt <<'EOF'
          调用 decision_add 工具记录一条决策，参数严格如下：
          summary=保持纯 Python 实现
          context=calc.py 现有 add/sub 两个函数无依赖
          decision=不引入第三方库
          rationale=需求只是加一个函数
          confidence=high
          只做这一件事，不要运行任何 shell 命令，不要读文件。
          调用完成后用 decision_list 工具确认链上条目。
          EOF
          # opencode-cli 免费模型：无需 key、无需登录（opencode-pi 桥接）
          pi -p "$(cat prompt.txt)" --provider opencode-cli \
            --model opencode/kimi-k2.5-free \
            2>&1 | tee "$GITHUB_WORKSPACE/e2e/out.txt" || true
          if grep -q "Error" "$GITHUB_WORKSPACE/e2e/out.txt"; then
            echo "E2E FAILED: see out.txt"
            exit 1
          fi
      - name: Verify chain and audit state
        run: |
          # 决策链默认 .pi/ 下，公开模式 docs/decisions/；用 find 定位，不假设路径
          CHAIN_FILE=$(find "$GITHUB_WORKSPACE" -name chain.md \
            \( -path "*docs/decisions*" \
               -o -path "*.pi/decision-auditor*" \) 2>/dev/null | head -1)
          STATE_FILE=$(find "$GITHUB_WORKSPACE" -name state.json \
            -path "*.pi/decision-auditor*" 2>/dev/null | head -1)
          if [ -z "$CHAIN_FILE" ]; then
            echo "FAIL: decision chain not found under GITHUB_WORKSPACE"
            exit 1
          fi
          echo "=== chain.md ($CHAIN_FILE) ==="
          cat "$CHAIN_FILE"
          echo "=== assertions (mechanism-level, deterministic) ==="
          grep -q "D-001" "$CHAIN_FILE" \
            && echo "PASS: decision_add wrote chain (extension loaded)" \
            || { echo "FAIL: chain missing D-001"; exit 1; }
          grep -q "Context:" "$CHAIN_FILE" \
            && echo "PASS: entry has structured fields" \
            || { echo "FAIL: malformed entry"; exit 1; }
          if [ -n "$STATE_FILE" ]; then
            grep -q '"lastAuditedId": "D-00' "$STATE_FILE" \
              && echo "PASS: audit advanced"
            grep -q '"inFlight": false' "$STATE_FILE" \
              && echo "PASS: lock released"
          else
            echo "WARN: state.json not found under GITHUB_WORKSPACE"
          fi
      - name: Run E2E - real work path (agent_end audit signoff)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e2" && cd "$GITHUB_WORKSPACE/e2e2"
          # 空 package.json 作为仓库根标记
          echo '{}' > package.json
          cat > prompt.txt <<'EOF'
          在 . 下创建一个 calculator.py 文件，包含 add(a, b) 和 sub(a, b)
          两个函数，每个函数用一行 return 实现。
          只做这一件事，不要运行 shell 命令，不要读其他文件。
          EOF
          pi -p "$(cat prompt.txt)" --provider opencode-cli \
            --model opencode/kimi-k2.5-free \
            2>&1 | tee "$GITHUB_WORKSPACE/e2e2/out.txt" || true
          if grep -q "Error" "$GITHUB_WORKSPACE/e2e2/out.txt"; then
            echo "E2E2 FAILED: see out.txt"
            exit 1
          fi
          if [ -f calculator.py ]; then
            echo "PASS: main agent produced artifact (calculator.py)"
          else
            echo "WARN: calculator.py missing (model variance; "
            echo "      mechanism still checked below)"
          fi
      - name: Verify real-path audit signoff
        run: |
          cd "$GITHUB_WORKSPACE/e2e2"
          # pi 可能把项目根解析到 GITHUB_WORKSPACE（仓库根有 package.json/.git），
          # 全工作区找、最新优先
          CONVLOG=$(find "$GITHUB_WORKSPACE" -name convlog.md -path "*.pi*" \
            2>/dev/null | xargs ls -t 2>/dev/null | head -1)
          STATE=$(find "$GITHUB_WORKSPACE" -name state.json -path "*.pi*" \
            2>/dev/null | xargs ls -t 2>/dev/null | head -1)
          if [ -z "$CONVLOG" ]; then
            echo "--- convlog anywhere under workspace? ---"
            find "$GITHUB_WORKSPACE" -name convlog.md 2>/dev/null || true
            echo "FAIL: convlog.md not generated (capture path dead)"
            exit 1
          fi
          echo "=== convlog ($CONVLOG) ==="
          head -20 "$CONVLOG"
          grep -q "## 👤" "$CONVLOG" \
            && echo "PASS: convlog captured user prompt" \
            || { echo "FAIL: convlog missing user prompt"; exit 1; }
          grep -q "## 🤖" "$CONVLOG" \
            && echo "PASS: convlog captured assistant reply" \
            || { echo "FAIL: convlog missing assistant reply"; exit 1; }
          if [ -z "$STATE" ]; then
            echo "FAIL: state.json missing (agent_end audit never ran)"
            exit 1
          fi
          echo "=== state ($STATE) ==="
          cat "$STATE"
          SIG=$(grep -o '"status": "[a-z-]*"' "$STATE" | tail -1)
          echo "audit signature: $SIG"
          case "$SIG" in
            *passed*|*passed-with-warning*)
              echo "PASS: audit gate passed on real work path" ;;
            *blocked*|*timeout*)
              echo "WARN: audit blocked — gate intercepted (real path"
              echo "      exercised; fix loop would engage)" ;;
            *)
              echo "FAIL: no audit signature written"
              exit 1 ;;
          esac
          grep -q '"inFlight": false' "$STATE" \
            && echo "PASS: lock released" \
            || { echo "FAIL: inFlight still true"; exit 1; }
          grep -q '"blockedStreak": [0-9]' "$STATE" \
            && echo "PASS: blockedStreak tracking present" \
            || { echo "WARN: blockedStreak field missing"; exit 1; }
      - name: Bench - audit blocking time (baseline vs process-log)
        run: |
          # 跑分：同代码库两次跑（PI_PAIR_PROCESS_LOG=0 基线 vs =1 方案），
          # 提取 lastAuditDurationMs 对比——验证过程日志是否减少 agent_end 阻塞。
          # 每次跑前清 .pi（隔离状态），跑后立即读最新 state。单次采样有模型噪声，
          # 结论看趋势（快/持平/慢），不作精确断言。
          run_bench() {
            local label="$1" flag="$2"
            local dir="$GITHUB_WORKSPACE/bench-$label"
            mkdir -p "$dir" && cd "$dir"
            echo '{}' > package.json
            echo '写一个 helper.py 文件，包含 double(x) 返回 x*2。只做这一件事。' \
              > prompt.txt
            # 进程级耗时：主 agent 工作相同（同 prompt），差值 ≈ 审计阻塞差异
            local start end
            start=$(date +%s%3N)
            PI_PAIR_PROCESS_LOG="$flag" pi -p "$(cat prompt.txt)" \
              --provider opencode-cli --model opencode/kimi-k2.5-free \
              >/dev/null 2>&1 || true
            end=$(date +%s%3N)
            local state dur sig
            state=$(find "$GITHUB_WORKSPACE" -name state.json -path "*.pi*" \
              2>/dev/null | xargs ls -t 2>/dev/null | head -1)
            dur=$(grep -o '"lastAuditDurationMs": [0-9]*' "$state" \
              | head -1 | grep -o '[0-9]*')
            sig=$(grep -o '"status": "[a-z-]*"' "$state" | tail -1 \
              | cut -d'"' -f4)
            echo "$label: process_ms=$((end-start)) "\
              "audit_duration=${dur:-NA}ms signature=$sig"
          }
          # 跑前清一次（e2e/e2e2 残留状态不干扰 bench）
          rm -rf "$GITHUB_WORKSPACE/.pi"
          echo "=== bench (single-sample, model noise expected) ==="
          run_bench baseline 0
          rm -rf "$GITHUB_WORKSPACE/.pi"
          run_bench process 1
